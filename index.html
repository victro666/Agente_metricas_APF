<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copiloto de Métricas APF</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; color: #333; max-width: 1000px; margin: 0 auto; padding: 20px; }
        h1 { color: #2c3e50; text-align: center; }
        .card { background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); margin-bottom: 20px; }
        
        /* Abas */
        .tabs { display: flex; margin-bottom: 15px; border-radius: 4px; overflow: hidden; }
        .tab-btn { flex: 1; padding: 12px; background: #e9ecef; border: none; cursor: pointer; font-weight: bold; color: #495057; transition: background 0.2s; }
        .tab-btn:hover { background: #dde2e6; }
        .tab-btn.active { background: #3498db; color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        
        /* Formulários */
        textarea { width: 100%; height: 120px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; resize: vertical; margin-bottom: 10px; box-sizing: border-box; }
        input[type="file"] { margin-bottom: 10px; font-size: 15px; }
        button.submit-btn { background: #27ae60; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; width: 100%; font-weight: bold; }
        button.submit-btn:hover { background: #2ecc71; }
        #loading { display: none; text-align: center; font-weight: bold; color: #f39c12; margin-top: 15px; }
        
        /* Resumo e Tabela */
        .summary-box { background: #f8f9fa; border-left: 5px solid #3498db; padding: 15px; margin-bottom: 20px; border-radius: 4px; }
        .summary-box p { margin: 5px 0; }
        .highlight-pf { color: #27ae60; font-size: 1.3em; font-weight: bold; }
        
        .table-responsive { overflow-x: auto; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; font-size: 0.9em; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid #ddd; }
        th { background-color: #2c3e50; color: white; white-space: nowrap; }
        tr:hover { background-color: #f1f2f6; }
        
        /* Badges para as classificações */
        .badge { padding: 5px 10px; border-radius: 12px; font-size: 0.85em; font-weight: bold; color: white; display: inline-block; text-align: center; min-width: 35px; }
        .badge.EE { background-color: #3498db; }
        .badge.SE { background-color: #9b59b6; }
        .badge.CE { background-color: #f39c12; }
        .badge.ALI { background-color: #e74c3c; }
        .badge.AIE { background-color: #7f8c8d; }
    </style>
</head>
<body>

    <h1>Copiloto de Métricas APF (IFPUG)</h1>

    <div class="card">
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('texto')">Analisar Texto</button>
            <button class="tab-btn" onclick="switchTab('arquivo')">Upload de Arquivo (PDF/TXT)</button>
        </div>

        <div id="texto" class="tab-content active">
            <textarea id="req-texto" placeholder="Cole aqui os requisitos do sistema..."></textarea>
            <button class="submit-btn" onclick="analisarTexto()">Extrair Processos via Texto</button>
        </div>

        <div id="arquivo" class="tab-content">
            <input type="file" id="req-arquivo" accept=".pdf,.txt">
            <button class="submit-btn" onclick="analisarArquivo()">Extrair Processos via Arquivo</button>
        </div>

        <div id="loading">⏳ Analisando requisitos com Llama-3 (Groq)... Isso pode levar alguns segundos.</div>
    </div>

    <!-- Onde o resultado será injetado pelo JavaScript -->
    <div class="card" id="resultado-card" style="display: none;">
        <div id="resultado-conteudo"></div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            event.target.classList.add('active');
        }

        async function analisarTexto() {
            const texto = document.getElementById('req-texto').value;
            if (texto.length < 20) return alert("Insira pelo menos 20 caracteres.");
            
            showLoading(true);
            try {
                const response = await fetch('/api/v1/extrair-texto', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ nome_projeto: "Projeto_Web", texto_requisitos: texto })
                });
                const data = await response.json();
                exibirResultadoFormatado(data);
            } catch (error) { alert("Erro na requisição. Verifique os logs da API."); }
            showLoading(false);
        }

        async function analisarArquivo() {
            const arquivoInput = document.getElementById('req-arquivo');
            if (arquivoInput.files.length === 0) return alert("Selecione um arquivo.");

            const formData = new FormData();
            formData.append("arquivo", arquivoInput.files[0]);

            showLoading(true);
            try {
                const response = await fetch('/api/v1/extrair-arquivo', {
                    method: 'POST',
                    body: formData
                });
                const data = await response.json();
                exibirResultadoFormatado(data);
            } catch (error) { alert("Erro ao enviar arquivo."); }
            showLoading(false);
        }

        function showLoading(show) {
            document.getElementById('loading').style.display = show ? 'block' : 'none';
            document.getElementById('resultado-card').style.display = 'none';
        }

        function exibirResultadoFormatado(data) {
            // Monta o painel de resumo
            let html = `
                <div class="summary-box">
                    <p><strong>Projeto Analisado:</strong> ${data.nome_projeto}</p>
                    <p><strong>Contexto Extraído pela IA:</strong> ${data.contexto_global_extraido}</p>
                    <p><strong>Tamanho Funcional Estimado:</strong> <span class="highlight-pf">${data.tamanho_funcional_total_pf} PF</span> (NESMA)</p>
                </div>
                <h3>Componentes Funcionais Básicos (CFB)</h3>
            `;

            if (data.componentes && data.componentes.length > 0) {
                // Monta a Tabela
                html += `
                    <div class="table-responsive">
                        <table>
                            <thead>
                                <tr>
                                    <th>Processo / Dado</th>
                                    <th>Tipo</th>
                                    <th>PF</th>
                                    <th>Referência no Requisito</th>
                                    <th>Raciocínio IFPUG CPM</th>
                                    <th>Confiança</th>
                                </tr>
                            </thead>
                            <tbody>
                `;
                
                // Popula as linhas
                data.componentes.forEach(cfb => {
                    html += `
                        <tr>
                            <td><strong>${cfb.nome_cfb}</strong></td>
                            <td><span class="badge ${cfb.tipo}">${cfb.tipo}</span></td>
                            <td><strong>${cfb.pf_nesma}</strong></td>
                            <td><em>"${cfb.trecho_referencia}"</em></td>
                            <td>${cfb.raciocinio_cpm}</td>
                            <td>${cfb.confianca}</td>
                        </tr>
                    `;
                });

                html += `
                            </tbody>
                        </table>
                    </div>
                `;
            } else {
                html += `<p style="color: #e74c3c;">Nenhum Componente Funcional Básico foi identificado nestes requisitos.</p>`;
            }

            document.getElementById('resultado-conteudo').innerHTML = html;
            document.getElementById('resultado-card').style.display = 'block';
        }
    </script>
</body>
</html>
