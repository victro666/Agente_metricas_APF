<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Copiloto APF</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-8">
    <div class="max-w-5xl mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-blue-600">Copiloto de Métricas APF</h1>
        
        <!-- Formulário de Envio -->
        <div class="bg-white p-6 rounded-lg shadow mb-8">
            <label class="block text-sm font-medium text-gray-700 mb-2">Envie o documento de requisitos (.txt ou .pdf)</label>
            <input type="file" id="arquivo" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 mb-4" />
            <button id="btnEnviar" class="bg-blue-600 text-white px-6 py-2 rounded font-medium hover:bg-blue-700 transition duration-150">Analisar Arquivo</button>
            <p id="status" class="mt-4 text-sm text-blue-600 font-semibold hidden animate-pulse">Processando blocos de texto... Isso pode levar alguns minutos devido às pausas da API.</p>
        </div>

        <!-- Painel de Resultados -->
        <div id="resultados" class="hidden space-y-6">
            <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
                <div class="bg-white p-6 rounded-lg shadow border-l-4 border-blue-500">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Tamanho Funcional</h3>
                    <p class="text-4xl font-black text-blue-600 mt-2" id="res-total-pf">0 PF</p>
                </div>
                <div class="bg-white p-6 rounded-lg shadow border-l-4 border-green-500 md:col-span-2">
                    <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider">Contexto Global Extraído</h3>
                    <p class="text-sm mt-2 text-gray-700 leading-relaxed" id="res-contexto"></p>
                </div>
            </div>

            <!-- Tabela de Componentes -->
            <div class="bg-white rounded-lg shadow overflow-hidden">
                <table class="min-w-full divide-y divide-gray-200">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Nome do CFB</th>
                            <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">Tipo</th>
                            <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider">PFs</th>
                            <th class="px-6 py-3 text-left text-xs font-bold text-gray-500 uppercase tracking-wider w-1/2">Raciocínio CPM</th>
                        </tr>
                    </thead>
                    <tbody id="tabela-corpo" class="bg-white divide-y divide-gray-200 text-sm">
                        <!-- As linhas serão injetadas via JavaScript -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('btnEnviar').addEventListener('click', async () => {
            const fileInput = document.getElementById('arquivo');
            const btn = document.getElementById('btnEnviar');
            const status = document.getElementById('status');
            const resultados = document.getElementById('resultados');
            
            if (!fileInput.files[0]) {
                alert('Selecione um arquivo de requisitos primeiro.');
                return;
            }

            // Prepara a interface para o carregamento
            btn.disabled = true;
            btn.classList.add('opacity-50', 'cursor-not-allowed');
            status.classList.remove('hidden');
            resultados.classList.add('hidden');

            const formData = new FormData();
            formData.append('arquivo', fileInput.files[0]);

            try {
                // Faz a requisição ao backend FastAPI
                const response = await fetch('/api/v1/extrair-arquivo', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (!response.ok) throw new Error(data.detail || 'Erro ao comunicar com a API.');

                // Preenche os cards superiores
                document.getElementById('res-total-pf').textContent = data.tamanho_funcional_total_pf + ' PF';
                document.getElementById('res-contexto').textContent = data.contexto_global_extraido;
                
                // Preenche a tabela de CFBs
                const tbody = document.getElementById('tabela-corpo');
                tbody.innerHTML = '';
                
                if (data.componentes && data.componentes.length > 0) {
                    data.componentes.forEach(cfb => {
                        tbody.innerHTML += `
                            <tr class="hover:bg-gray-50">
                                <td class="px-6 py-4 font-bold text-gray-900">${cfb.nome_cfb}</td>
                                <td class="px-6 py-4"><span class="px-3 py-1 inline-flex text-xs leading-5 font-bold rounded-full bg-blue-100 text-blue-800">${cfb.tipo}</span></td>
                                <td class="px-6 py-4 font-bold text-gray-700">${cfb.pf_nesma}</td>
                                <td class="px-6 py-4 text-xs text-gray-600">${cfb.raciocinio_cpm}</td>
                            </tr>
                        `;
                    });
                } else {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="4" class="px-6 py-8 text-center text-gray-500">
                                <span class="block font-bold mb-1">Nenhum componente funcional extraído.</span>
                                O arquivo possui apenas requisitos não funcionais ou a Groq bloqueou a requisição por excesso de tokens.
                            </td>
                        </tr>`;
                }
                
                resultados.classList.remove('hidden');
            } catch (error) {
                alert('Erro durante a extração: ' + error.message);
            } finally {
                // Restaura a interface
                btn.disabled = false;
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                status.classList.add('hidden');
            }
        });
    </script>
</body>
</html>
